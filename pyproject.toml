[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "spel"
version = "0.5"
requires-python = ">=3.11"
dependencies = [
	"pandas>=2.2.2",
	"pytest>=8.3.4",
	"pytest-subtests>=0.14.1",
	"numpy>=1.26",
	"h5py>=3.12.1",
	"scipy>=1.14.1",
	"tabulate>=0.9.0",
	"xarray>=2024.7",
	"netCDF4>=1.7.2",
	"colorlog>=6.9.0",
	"dotenv",
	"mpi4py",
]

[project.optional-dependencies]
# Django web app / database (spel/db)
db = ["Django>=5.1.2"]
# MariaDB/MySQL backend for the hosted instance (DB_ENGINE=mysql)
mysql = ["mysqlclient"]
# Loader/view tests under spel/db
db-test = ["pytest-django"]
# NN emulator training (`spel sample`, `spel train`)
ml = ["torch", "scikit-learn"]
# Property-based tests (`spel proptest`)
proptest = ["hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["spel*"]

[tool.setuptools.package-data]
"spel.transforms.compact" = ["templates/*.F90", "*.md"]
"spel.machines" = ["*.toml"]
"spel.proptest" = ["examples/*.toml", "*.md"]

[project.scripts]
spel = "spel.cli:main"

[tool.pytest.ini_options]
# Django tests under spel/db need the `db-test` extra; `db.spel.settings` resolves with spel/ on the path
pythonpath = ["spel"]
DJANGO_SETTINGS_MODULE = "db.spel.settings"
